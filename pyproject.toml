[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imaginary-fabric"
version = "0.1.0"
description = "Python orchestration layer for molecular ML on Grumpy."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Imaginary Biolabs GmbH", email = "hello@imaginary.bio" }]
license = { text = "Proprietary" }
keywords = ["molecular-ml", "fabric", "grumpy", "benchmarking"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
imaginary = "fabric.cli.main:main_entry"

[project.optional-dependencies]
core = [
  "biopandas>=0.5",
  "numpy>=1.23",
  "omegaconf>=2.3",
  "pandas>=1.5",
  "pyyaml>=6",
  "rich>=13",
  "typer>=0.12",
]
platform = [
  "imaginary-fabric[core]",
  "httpx>=0.27",
]
torch = [
  "imaginary-fabric[core]",
  "torch>=2.0",
  "lightning>=2.0",
]
tensorflow = [
  "imaginary-fabric[core]",
  "tensorflow>=2.12",
]
dev = [
  "imaginary-fabric[core]",
  "imaginary-fabric[torch]",
  "imaginary-fabric[platform]",
  "pytest>=7",
  "pytest-cov>=4",
  "ruff>=0.4",
]
docs = [
  "imaginary-fabric[core]",
  "mkdocs>=1.5,<2",
  "mkdocs-material>=9,<10",
  "mkdocstrings[python]>=0.27",
]

[project.urls]
Homepage = "https://github.com/Imaginary-Biolabs/fabric"
Documentation = "https://imaginary-biolabs.github.io/fabric/"
Repository = "https://github.com/Imaginary-Biolabs/fabric"
Issues = "https://github.com/Imaginary-Biolabs/fabric/issues"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
