name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: Imaginary-Biolabs/grumpy
          path: grumpy
        continue-on-error: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -d grumpy ]; then pip install -e grumpy; fi
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests

      - name: Phase 1 tolls
        run: pytest tests/tolls/test_phase_1.py -x --tb=short -q
